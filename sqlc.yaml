version: "2"

sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"

    gen:
      go:
        package: "repo"
        out: "internal/repo"
        sql_package: "pgx/v5"

        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
