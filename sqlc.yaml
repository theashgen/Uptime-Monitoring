version: "2"

sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"

    gen:
      go:
        package: "repo"
        out: "internal/repo"
        sql_package: "pgx/v5"

        emit_pointers_for_null_types: true

        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int"

          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              type: "int64"

          - db_type: "pg_catalog.text"
            nullable: true
            go_type:
              type: "string"

          - db_type: "pg_catalog.text"
            nullable: true
            go_type:
              type: "string"
